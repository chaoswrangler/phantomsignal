name: Build GitHub Pages from Feed

on:
  push:
    branches:
      - main
    paths:
      - "docs/feed.json"
      - "docs/brief/**"
      - "scripts/build-page.js"
      - ".github/workflows/build-pages.yml"

  schedule:
    # Hourly at :20 past the hour — runs 15 minutes after the aggregator
    # so build-page.js renders the newest feed.json. Adjust if aggregate
    # consistently takes longer than 15 minutes.
    - cron: "20 * * * *"

  workflow_dispatch:

concurrency:
  group: build-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build index.html from feed.json
        run: node scripts/build-page.js

      - name: Commit generated page
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build GitHub Pages feed"
          file_pattern: docs/index.html
