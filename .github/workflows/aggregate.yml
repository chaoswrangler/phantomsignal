name: Aggregate Feeds

on:
  schedule:
    # Hourly at :05 past the hour to avoid contention with other repos
    # that run at :00. Adjust if you see commit collisions.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "How far back to scan (hours). Common: 24, 36, 168 (1 week), 336 (2 weeks)."
        required: false
        default: "168"
        type: string
  push:
    paths:
      - "feeds.yaml"
      - "aggregate.py"
      - "taxonomy.py"
      - "affinity.py"
      - "requirements.txt"

# Prevent overlapping runs. If a run is in progress when the next hour fires,
# the new run is queued but only the most recent one executes — older queued
# runs are cancelled. This protects against fetch-and-commit races.
concurrency:
  group: aggregate-feeds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggregator
        env:
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '168' }}
        run: python aggregate.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Generated files are authoritative — they always win.
          # Strategy: fetch latest, reset main to it, then re-stage our generated
          # files on top and push. If push fails (another workflow won the race),
          # retry up to 3 times by re-running the same merge-free pattern.
          for attempt in 1 2 3; do
            # Save our freshly-generated files outside the working tree.
            mkdir -p /tmp/phantom-outputs
            cp docs/feed.json /tmp/phantom-outputs/feed.json
            cp docs/briefing_packet.json /tmp/phantom-outputs/briefing_packet.json

            # Sync to whatever is now on origin/main, discarding any local divergence.
            git fetch origin main
            git reset --hard origin/main

            # Put our generated files back on top of the synced state.
            cp /tmp/phantom-outputs/feed.json docs/feed.json
            cp /tmp/phantom-outputs/briefing_packet.json docs/briefing_packet.json

            git add docs/feed.json docs/briefing_packet.json

            # If nothing actually changed (e.g., feed.json identical to what's
            # already on main), exit cleanly.
            if git diff --staged --quiet; then
              echo "No changes to commit (attempt $attempt). Exiting cleanly."
              exit 0
            fi

            git commit -m "Update PHANTOMSignal feed [skip ci]"

            if git push origin main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push failed on attempt $attempt — likely a concurrent push from build-pages workflow. Retrying."
            sleep 5
          done

          echo "Push failed after 3 attempts. Failing the workflow."
          exit 1
